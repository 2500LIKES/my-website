<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="admin-page">
<header class="admin-head"><div><small>MEKDIWA</small><h1>ADMIN DASHBOARD</h1></div><button id="logoutBtn" class="open-btn">ออกจากระบบ</button></header>
<section class="admin-section"><h2>ตั้งค่าหน้าเว็บ</h2><div class="form-grid">
<label>ชื่อเว็บไซต์<input id="siteName"></label><label>โลโก้ URL<input id="logoUrl"></label><label class="full">ประกาศหน้าเว็บ<textarea id="announcement"></textarea></label>
</div><button id="saveSettings" class="primary-btn">บันทึกการตั้งค่า</button><span id="settingsMsg" class="form-msg"></span></section>

<section class="admin-section"><div class="section-head"><h2>เว็บไซต์แนะนำ</h2><button class="open-btn" onclick="openEditor('links')">+ เพิ่ม</button></div><div id="linksAdmin"></div></section>
<section class="admin-section"><div class="section-head"><h2>กิจกรรม</h2><button class="open-btn" onclick="openEditor('events')">+ เพิ่ม</button></div><div id="eventsAdmin"></div></section>
<section class="admin-section"><div class="section-head"><h2>แจกโค้ด</h2><button class="open-btn" onclick="openEditor('codes')">+ เพิ่ม</button></div><div id="codesAdmin"></div></section>
</main>

<div id="editor" class="modal"><div class="modal-card"><button class="modal-close" onclick="closeEditor()">×</button><h2 id="editorTitle">เพิ่มรายการ</h2><input type="hidden" id="editId"><input type="hidden" id="editTable">
<label>ชื่อ<input id="fTitle"></label><label>URL<input id="fUrl"></label><label>รูปภาพ URL<input id="fImage"></label><label>ข้อความปุ่ม<input id="fButton" placeholder="เปิดเว็บไซต์"></label><label>รายละเอียด<input id="fDesc"></label><label id="codeLabel">โค้ด<input id="fCode"></label>
<label>เปิดใช้งาน <select id="fEnabled"><option value="true">เปิด</option><option value="false">ปิด</option></select></label>
<button id="saveItem" class="primary-btn">บันทึก</button><div id="itemMsg" class="form-msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
